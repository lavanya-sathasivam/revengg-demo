<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create an account — Contract Intelligence</title>
<style>
  :root {
    --bg-app: #0b1329;
    --sidebar-bg: #0f172a;
    --sidebar-hover: #1e293b;
    --sidebar-active: #1e3a8a;
    --sidebar-border: #1e293b;
    --sidebar-text: #94a3b8;
    --sidebar-text-active: #ffffff;

    --bg-main: #f8fafc;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;

    --text: #0f172a;
    --text-muted: #64748b;
    --text-subtle: #94a3b8;

    --accent: #1e40af;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff6ff;

    --ok: #15803d;
    --ok-soft: #dcfce7;
    --ok-border: #bbf7d0;

    --danger: #b91c1c;
    --danger-soft: #fee2e2;
    --danger-border: #fecaca;

    --radius-lg: 12px;
    --radius: 8px;
    --radius-sm: 6px;
    --shadow: 0 2px 4px rgba(15, 23, 42, 0.06), 0 4px 12px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg-app);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .auth-card {
    width: 100%;
    max-width: 420px;
    padding: 0 24px;
  }

  .auth-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .auth-brand-icon {
    width: 36px;
    height: 36px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #fff;
  }
  .auth-brand-text {
    display: flex;
    flex-direction: column;
  }
  .auth-brand-title {
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .auth-brand-tag {
    color: #64748b;
    font-size: 0.72rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .auth-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 32px 28px;
    margin-top: 24px;
  }
  .auth-panel h1 {
    margin: 0 0 8px;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--text);
  }
  .auth-panel p {
    margin: 0 0 24px;
    color: var(--text-muted);
    font-size: 0.88rem;
  }

  .field {
    margin-bottom: 16px;
  }
  .field-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.88rem;
    font-family: inherit;
    background: #ffffff;
    color: var(--text);
  }
  .form-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12);
  }

  .banner-msg {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 0.84rem;
    margin-bottom: 16px;
    display: none;
  }
  .banner-msg.err {
    background: var(--danger-soft);
    border: 1px solid var(--danger-border);
    color: var(--danger);
  }
  .banner-msg.ok {
    background: var(--ok-soft);
    border: 1px solid var(--ok-border);
    color: var(--ok);
  }

  .btn-primary {
    width: 100%;
    padding: 10px 18px;
    border-radius: var(--radius);
    background: var(--accent);
    color: #ffffff;
    border: none;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
  }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .auth-footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.86rem;
    color: var(--text-muted);
    text-align: center;
  }
  .auth-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .auth-footer a:hover { text-decoration: underline; }

  .pw-rule {
    font-size: 0.78rem;
    color: var(--text-subtle);
    margin-top: 4px;
  }

  @media (max-width: 480px) {
    .auth-card { padding: 0 16px; }
    .auth-panel { padding: 24px 20px; }
  }
</style>
</head>
<body>

<div class="auth-card">
  <div class="auth-brand">
    <div class="auth-brand-text">
      <div class="auth-brand-title">Contract Intel</div>
      <div class="auth-brand-tag">Legal Risk &amp; Analysis</div>
    </div>
  </div>

  <div class="auth-panel">
    <h1>Create an account</h1>
    <p>Register your firm account. After signing in you can create or join a firm workspace and manage contracts.</p>

    <div id="register-error" class="banner-msg err"></div>
    <div id="register-ok" class="banner-msg ok"></div>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="reg-subject" class="field-label">Subject (email or username)</label>
        <input type="text" id="reg-subject" class="form-input" placeholder="you@firm.example" required autocomplete="username">
      </div>
      <div class="field">
        <label for="reg-display-name" class="field-label">Display name</label>
        <input type="text" id="reg-display-name" class="form-input" placeholder="Your name" autocomplete="name">
      </div>
      <div class="field">
        <label for="reg-password" class="field-label">Password</label>
        <input type="password" id="reg-password" class="form-input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" required autocomplete="new-password">
        <div class="pw-rule">At least 8 characters.</div>
      </div>
      <button type="submit" id="reg-submit" class="btn-primary">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="/login">Sign in &rarr;</a>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var form = document.getElementById("register-form");
  var subjectInput = document.getElementById("reg-subject");
  var displayNameInput = document.getElementById("reg-display-name");
  var passwordInput = document.getElementById("reg-password");
  var submitBtn = document.getElementById("reg-submit");
  var errorEl = document.getElementById("register-error");
  var okEl = document.getElementById("register-ok");

  function showError(message) {
    errorEl.textContent = message;
    errorEl.style.display = message ? "block" : "none";
    okEl.style.display = "none";
  }
  function showOk(message) {
    okEl.textContent = message;
    okEl.style.display = "block";
    errorEl.style.display = "none";
  }
  function setLoading(loading) {
    submitBtn.disabled = loading;
    submitBtn.textContent = loading ? "Creating account..." : "Create account";
  }

  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      showError("");
      showOk("");
      setLoading(true);

      var body = JSON.stringify({
        subject: subjectInput.value,
        display_name: displayNameInput.value || undefined,
        password: passwordInput.value,
      });

      fetch("/auth/register", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: body,
      })
        .then(function (res) {
          if (!res.ok) {
            var detail = "";
            try { detail = res.json().detail || ""; } catch (e) {}
            throw new Error(detail || "Could not create account.");
          }
          return res.json();
        })
        .then(function (data) {
          setLoading(false);
          form.reset();
          showOk(data.message || "Account created. You can now sign in.");
          subjectInput.focus();
        })
        .catch(function (err) {
          showError(err.message || "Could not create account. Please try again.");
          setLoading(false);
          subjectInput.focus();
        });
    });
  }
})();
</script>

</body>
</html>
